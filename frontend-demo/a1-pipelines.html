<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A-Solid Observe · Pipeline 列表</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --color-primary: #1E40AF;
  --color-primary-soft: rgba(30, 64, 175, 0.08);
  --color-secondary: #3B82F6;
  --color-accent: #D97706;
  --color-background: #F8FAFC;
  --color-text: #0F172A;
  --color-text-muted: #64748B;
  --color-muted: #E9EEF6;
  --color-border: #DBEAFE;
  --color-border-soft: rgba(30, 64, 175, 0.08);

  --pipe-published: #16A34A;
  --pipe-draft: #D97706;
  --pipe-archived: #64748B;

  --exec-success: #16A34A;
  --exec-short: #D97706;
  --exec-failed: #DC2626;

  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.10);

  --radius-card: 16px;
  --radius-pill: 999px;

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--color-background);
  color: var(--color-text);
  font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 80% 60% at 0% 0%, rgba(59, 130, 246, 0.10), transparent 60%),
    radial-gradient(ellipse 60% 50% at 100% 0%, rgba(217, 119, 6, 0.06), transparent 60%);
  background-attachment: fixed;
}

.num, .mono { font-family: 'Fira Code', ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }

/* === Top Nav === */
.topbar {
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  background: rgba(248, 250, 252, 0.72);
  border-bottom: 1px solid var(--color-border-soft);
}
.topbar-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 14px var(--space-2xl);
  display: flex; align-items: center; gap: var(--space-xl);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 16px;
  color: var(--color-primary);
  text-decoration: none;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 50%, #0EA5E9 100%);
  position: relative;
  box-shadow: 0 4px 10px rgba(30, 64, 175, 0.25);
}
.brand-mark::after {
  content: ''; position: absolute; inset: 6px;
  border-radius: 4px;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.85), transparent 60%);
}
.nav-spacer { flex: 1; }
.namespace-switch {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 500; cursor: pointer;
  color: var(--color-text);
  transition: all 200ms var(--ease);
}
.namespace-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--pipe-published);
  box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
}
.role-tabs {
  display: inline-flex;
  background: rgba(255,255,255,0.6);
  border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-pill);
  padding: 4px; gap: 2px;
}
.role-tab {
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 500;
  color: var(--color-text-muted);
  cursor: pointer; border: none; background: transparent;
  transition: all 200ms var(--ease);
  text-decoration: none;
}
.role-tab.active {
  background: var(--color-primary);
  color: #fff;
  box-shadow: 0 2px 8px rgba(30, 64, 175, 0.28);
}

/* === Subtabs === */
.subtabs {
  background: rgba(248, 250, 252, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--color-border-soft);
}
.subtabs-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 var(--space-2xl);
  display: flex;
  gap: var(--space-md);
  overflow-x: auto;
}
.subtab {
  padding: 14px 0;
  font-size: 13px;
  font-weight: 500;
  color: var(--color-text-muted);
  text-decoration: none;
  border-bottom: 2px solid transparent;
  transition: all 200ms var(--ease);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.subtab:hover { color: var(--color-text); }
.subtab.active {
  color: var(--color-primary);
  border-bottom-color: var(--color-primary);
}
.subtab svg { width: 14px; height: 14px; }

/* === Page === */
.page {
  max-width: 1440px;
  margin: 0 auto;
  padding: var(--space-xl) var(--space-2xl);
  display: flex;
  flex-direction: column;
  gap: var(--space-xl);
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-xl);
  flex-wrap: wrap;
}
.page-title {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 4px 0;
}
.page-subtitle {
  font-size: 13px;
  color: var(--color-text-muted);
  margin: 0;
}

.btn-new {
  padding: 11px 18px;
  background: var(--color-accent);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  transition: all 200ms var(--ease);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(217, 119, 6, 0.28);
}
.btn-new:hover {
  background: #B45309;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(217, 119, 6, 0.4);
}
.btn-new svg { width: 14px; height: 14px; }

/* === Filters === */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-md);
  align-items: center;
  padding: var(--space-md) var(--space-lg);
  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(14px);
  border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-sm);
}
.filter-group { display: inline-flex; align-items: center; gap: 8px; }
.filter-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.pill-group {
  display: inline-flex;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-pill);
  padding: 3px; gap: 2px;
}
.opt-pill {
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 500;
  color: var(--color-text-muted);
  cursor: pointer; border: none; background: transparent;
  transition: all 200ms var(--ease);
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 5px;
}
.opt-pill:hover { color: var(--color-text); }
.opt-pill.active.published { background: rgba(22,163,74,0.12); color: var(--pipe-published); }
.opt-pill.active.draft { background: rgba(217,119,6,0.12); color: var(--pipe-draft); }
.opt-pill.active.archived { background: rgba(100,116,139,0.12); color: var(--pipe-archived); }
.opt-pill.active.primary {
  background: var(--color-primary);
  color: #fff;
}

.filter-spacer { flex: 1; }

.search-box {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-pill);
  min-width: 220px;
}
.search-box svg { width: 14px; height: 14px; color: var(--color-text-muted); flex-shrink: 0; }
.search-box input {
  border: none; background: transparent; outline: none;
  font-family: inherit; font-size: 13px;
  color: var(--color-text); flex: 1; min-width: 0;
}
.search-box input::placeholder { color: var(--color-text-muted); }

/* === Grid === */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: var(--space-lg);
}

.pipe-card {
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(14px);
  border: 1px solid var(--color-border-soft);
  border-radius: var(--radius-card);
  padding: var(--space-lg);
  box-shadow: var(--shadow-sm);
  transition: all 200ms var(--ease);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: var(--space-md);
  animation: cardIn 380ms var(--ease) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.pipe-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: var(--color-secondary);
}
.pipe-card.archived {
  opacity: 0.55;
}
.pipe-card.archived:hover {
  opacity: 0.85;
}

.pipe-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--status-color);
}
.pipe-card.published { --status-color: var(--pipe-published); }
.pipe-card.draft { --status-color: var(--pipe-draft); }
.pipe-card.archived { --status-color: var(--pipe-archived); }

.pipe-card.draft::before {
  background: linear-gradient(90deg, transparent, var(--pipe-draft), transparent);
  background-size: 200% 100%;
  animation: draftBreath 2s var(--ease) infinite;
}
@keyframes draftBreath {
  0%, 100% { background-position: 100% 0; opacity: 0.6; }
  50% { background-position: 0% 0; opacity: 1; }
}

.pipe-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.pipe-card-title-block {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.pipe-card-name {
  font-size: 17px;
  font-weight: 600;
  color: var(--color-text);
  letter-spacing: -0.01em;
  margin: 0;
}
.pipe-card-desc {
  font-size: 12px;
  color: var(--color-text-muted);
  line-height: 1.4;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  flex-shrink: 0;
}
.status-pill .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.pipe-card.published .status-pill {
  background: rgba(22, 163, 74, 0.10);
  color: var(--pipe-published);
}
.pipe-card.published .status-pill .dot {
  box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
}
.pipe-card.draft .status-pill {
  background: rgba(217, 119, 6, 0.10);
  color: var(--pipe-draft);
}
.pipe-card.draft .status-pill .dot {
  animation: draftDot 2s var(--ease) infinite;
}
@keyframes draftDot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 6, 0.5); }
  50% { box-shadow: 0 0 0 4px rgba(217, 119, 6, 0); }
}
.pipe-card.archived .status-pill {
  background: rgba(100, 116, 139, 0.10);
  color: var(--pipe-archived);
}

.pipe-card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: rgba(255,255,255,0.6);
  border: 1px solid var(--color-border-soft);
  border-radius: 6px;
  font-size: 11px;
  color: var(--color-text-muted);
  font-family: 'Fira Code', monospace;
}
.tag svg { width: 11px; height: 11px; }
.tag.team {
  background: var(--color-primary-soft);
  color: var(--color-primary);
  border-color: rgba(30, 64, 175, 0.15);
}
.tag.app {
  background: rgba(14, 165, 233, 0.08);
  color: #0EA5E9;
  border-color: rgba(14, 165, 233, 0.18);
}
.tag.groovy {
  background: rgba(15, 23, 42, 0.06);
  color: #0F172A;
  border-color: rgba(15, 23, 42, 0.15);
  font-weight: 600;
}
.tag.groovy svg { color: #6366F1; }
.tag.label {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 3px 8px 3px 6px;
}
.tag.label .lk {
  color: var(--color-accent);
  font-weight: 600;
}
.tag.label .lv {
  color: var(--color-text);
  font-weight: 500;
}
.tag.label .lk::after { content: '='; color: var(--color-text-muted); margin-left: 3px; font-weight: 400; }
.tag.ver {
  background: rgba(217, 119, 6, 0.06);
  color: var(--color-accent);
  border-color: rgba(217, 119, 6, 0.15);
  margin-left: auto;
}

.pipe-card-spark {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: var(--space-md);
  border-top: 1px dashed var(--color-border);
}
.pipe-card-spark-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}
.pipe-card-spark-label {
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.pipe-card-spark-num {
  font-family: 'Fira Code', monospace;
  font-weight: 600;
  color: var(--color-text);
}
.pipe-card-spark-svg {
  width: 100%;
  height: 36px;
}

.pipe-card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: var(--space-md);
  border-top: 1px solid var(--color-border-soft);
  font-size: 12px;
  color: var(--color-text-muted);
}
.pipe-card-foot-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}
.foot-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'Fira Code', monospace;
}
.foot-item svg { width: 11px; height: 11px; }

.pipe-card-actions {
  display: flex;
  gap: 4px;
}
.icon-btn {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--color-border-soft);
  border-radius: 6px;
  cursor: pointer;
  color: var(--color-text-muted);
  transition: all 200ms var(--ease);
}
.icon-btn:hover {
  background: #fff;
  color: var(--color-primary);
  border-color: var(--color-secondary);
}
.icon-btn svg { width: 13px; height: 13px; }

.list-footer {
  padding: var(--space-lg);
  text-align: center;
  font-size: 12px;
  color: var(--color-text-muted);
}

@media (max-width: 768px) {
  .page { padding: var(--space-md); }
  .topbar-inner { padding: 12px var(--space-md); gap: var(--space-md); }
  .subtabs-inner { padding: 0 var(--space-md); }
  .namespace-switch { display: none; }
  .grid { grid-template-columns: 1fr; }
  .filters { padding: var(--space-md); }
}
</style>
</head>
<body>

<!-- Top Nav -->
<header class="topbar">
  <div class="topbar-inner">
    <a href="c1-dashboard.html" class="brand">
      <span class="brand-mark"></span>
      <span>A-Solid Observe</span>
    </a>
    <div class="namespace-switch">
      <span class="namespace-dot"></span>
      <span class="mono">ops</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <nav class="role-tabs">
      <a href="c1-dashboard.html" class="role-tab">大盘</a>
      <a href="b1-alerts.html" class="role-tab">告警</a>
      <a href="a1-pipelines.html" class="role-tab active">配置</a>
    </nav>
  </div>
</header>

<!-- Subtabs -->
<nav class="subtabs">
  <div class="subtabs-inner">
    <a href="a1-pipelines.html" class="subtab active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6h7M6 8.5v7M18 8.5v7M8.5 18h7"/></svg>
      Pipeline
    </a>
    <a href="a4-subscriptions.html" class="subtab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>
      Subscription
    </a>
    <a href="a2-pipeline-editor.html" class="subtab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      编辑器
    </a>
    <a href="a3-versions.html" class="subtab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v8M8 12h8"/><circle cx="12" cy="12" r="10"/></svg>
      版本
    </a>
  </div>
</nav>

<main class="page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Pipeline</h1>
      <p class="page-subtitle"><span class="num">9</span> 个 pipeline · <span class="num" style="color: var(--pipe-published); font-weight: 600;">6</span> PUBLISHED · <span class="num" style="color: var(--pipe-draft); font-weight: 600;">2</span> DRAFT · <span class="num" style="color: var(--pipe-archived);">1</span> ARCHIVED</p>
    </div>
    <button class="btn-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
      新建 Pipeline
    </button>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">状态</span>
      <div class="pill-group" id="statusFilter">
        <button class="opt-pill active primary" data-status="all">全部</button>
        <button class="opt-pill published" data-status="PUBLISHED"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>PUBLISHED</button>
        <button class="opt-pill draft" data-status="DRAFT"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>DRAFT</button>
        <button class="opt-pill archived" data-status="ARCHIVED"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;"></span>ARCHIVED</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">团队</span>
      <div class="pill-group" id="teamFilter">
        <button class="opt-pill active primary" data-team="all">全部</button>
        <button class="opt-pill" data-team="payment">支付</button>
        <button class="opt-pill" data-team="risk">风控</button>
        <button class="opt-pill" data-team="ops">运维</button>
      </div>
    </div>

    <div class="filter-spacer"></div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input type="text" placeholder="搜索 name / application..." id="searchInput" />
    </div>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid">
    <!-- rendered by JS -->
  </div>

  <div class="list-footer">
    共 <span class="num">9</span> 个 pipeline
  </div>
</main>

<script>
const ICON_VIEW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICON_ARCHIVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></svg>';

const ICON_APP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';

const pipelines = [
  { name: 'high-amount-order-alert', desc: '监测 CDC 订单流，金额 > 10000 触发 CRITICAL 告警，主用例。', status: 'PUBLISHED', version: 'v3', updatedAt: '2 小时前', spark: [12,8,15,10,18,14,22,16,20,28,24,32], execCount: 1842, groovyLines: 14, labels: { app: 'order-service', line: 'commerce', team: 'payment', domain: 'risk-control' } },
  { name: 'gateway-latency-alert', desc: 'API 网关 P99 延迟超 1.5s 触发 CRITICAL，1 分钟连续判定。', status: 'PUBLISHED', version: 'v2', updatedAt: '昨天', spark: [4,6,5,7,8,6,5,9,7,8,10,8], execCount: 720, groovyLines: 22, labels: { app: 'api-gateway', line: 'infra', team: 'ops', tier: 'edge' } },
  { name: 'risk-score-monitor', desc: '风控评分超 80 触发告警，关联用户行为分析，多条件组合。', status: 'PUBLISHED', version: 'v2', updatedAt: '3 天前', spark: [3,2,4,3,5,4,6,8,5,7,6,9], execCount: 412, groovyLines: 31, labels: { app: 'risk-engine', line: 'security', team: 'risk', model: 'v3' } },
  { name: 'db-health-monitor', desc: 'DB 连接池使用率 + 主从延迟 + 慢查询 三指标联合判定。', status: 'PUBLISHED', version: 'v6', updatedAt: '4 天前', spark: [2,1,2,3,2,1,2,1,3,2,2,1], execCount: 288, groovyLines: 47, labels: { app: 'db', line: 'infra', team: 'ops', db: 'mysql-primary' } },
  { name: 'order-failure-rate-warn', desc: '订单创建失败率 5 分钟滑动窗口超 3% 触发 WARNING。', status: 'PUBLISHED', version: 'v5', updatedAt: '5 天前', spark: [8,10,12,9,11,14,13,16,12,18,15,20], execCount: 588, groovyLines: 19, labels: { app: 'order-service', line: 'commerce', team: 'payment', window: '5m' } },
  { name: 'payment-callback-monitor', desc: '支付回调成功率低于 95% 触发告警，分租户维度。', status: 'PUBLISHED', version: 'v2', updatedAt: '1 周前', spark: [5,7,6,8,5,7,9,6,8,10,7,9], execCount: 421, groovyLines: 26, labels: { app: 'payment-gateway', line: 'payment', team: 'payment', sla: 'critical' } },
  { name: 'fraud-detection-v2', desc: '新版本欺诈检测：增加 IP 信誉 + 设备指纹联合判定。', status: 'DRAFT', version: 'draft v2', updatedAt: '今天 10:24', spark: [0,0,0,2,1,3,2,4,3,5,4,6], execCount: 0, groovyLines: 58, labels: { app: 'risk-engine', line: 'security', team: 'risk', feature: 'ip-rep' } },
  { name: 'inventory-mismatch-warn', desc: '库存对账差异检测：CDC 事件 + 定时全量对账双源校验。', status: 'DRAFT', version: 'draft v4', updatedAt: '今天 14:08', spark: [1,0,1,2,1,0,1,2,1,3,2,1], execCount: 0, groovyLines: 33, labels: { app: 'inventory', line: 'commerce', team: 'payment', mode: 'dual-source' } },
  { name: 'legacy-slow-query', desc: '老版本慢查询监控，已迁移到 db-health-monitor。', status: 'ARCHIVED', version: 'v1', updatedAt: '2 个月前', spark: [2,1,2,1,2,1,1,2,1,1,2,1], execCount: 142, groovyLines: 12, labels: { app: 'db', line: 'infra', team: 'ops', deprecated: 'true' } },
];

// team 派生自 labels.team
pipelines.forEach(p => {
  p.team = p.labels.team || 'other';
  p.teamLabel = ({ payment: '支付', ops: '运维', risk: '风控' })[p.team] || p.team;
  p.application = p.labels.app || '';
});

let filters = { status: 'all', team: 'all', q: '' };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildSparkSvg(data, color) {
  const w = 280, h = 36;
  const max = Math.max(...data, 1);
  const min = Math.min(...data, 0);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return [x, y];
  });
  const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${w},${h} L0,${h} Z`;
  const lastPt = pts[pts.length - 1];
  return `
    <svg class="pipe-card-spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sg${Math.random().toString(36).slice(2,8)}" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaPath}" fill="${color}" fill-opacity="0.18"/>
      <path d="${linePath}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${lastPt[0].toFixed(1)}" cy="${lastPt[1].toFixed(1)}" r="2.5" fill="${color}"/>
    </svg>
  `;
}

function statusColor(s) {
  if (s === 'PUBLISHED') return 'var(--pipe-published)';
  if (s === 'DRAFT') return 'var(--pipe-draft)';
  return 'var(--pipe-archived)';
}

function renderCard(p, i) {
  const card = document.createElement('article');
  card.className = `pipe-card ${p.status.toLowerCase()}`;
  card.dataset.name = p.name;
  card.dataset.status = p.status;
  card.dataset.team = p.team;
  card.style.animationDelay = `${Math.min(i * 40, 320)}ms`;

  card.innerHTML = `
    <div class="pipe-card-head">
      <div class="pipe-card-title-block">
        <h3 class="pipe-card-name">${p.name}</h3>
        <p class="pipe-card-desc">${p.desc}</p>
      </div>
      <span class="status-pill">
        <span class="dot"></span>
        ${p.status}
      </span>
    </div>

    <div class="pipe-card-tags">
      <span class="tag groovy" title="单节点 · Groovy 脚本"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>Groovy · ${p.groovyLines} 行</span>
      ${Object.entries(p.labels).map(([k, v]) => `<span class="tag label ${k === 'team' ? 'team' : k === 'app' ? 'app' : ''}"><span class="lk">${k}</span><span class="lv">${v}</span></span>`).join('')}
      <span class="tag ver">${ICON_VER}${p.version}</span>
    </div>

    ${p.status !== 'ARCHIVED' ? `
    <div class="pipe-card-spark">
      <div class="pipe-card-spark-head">
        <span class="pipe-card-spark-label">近期执行 · 12h</span>
        <span class="pipe-card-spark-num">${p.execCount.toLocaleString()} 次</span>
      </div>
      ${buildSparkSvg(p.spark, statusColor(p.status))}
    </div>
    ` : ''}

    <div class="pipe-card-foot">
      <div class="pipe-card-foot-meta">
        <span class="foot-item">${ICON_TIME}${p.updatedAt}</span>
      </div>
      <div class="pipe-card-actions">
        <button class="icon-btn" title="查看">${ICON_VIEW}</button>
        <button class="icon-btn" title="编辑">${ICON_EDIT}</button>
        <button class="icon-btn" title="归档">${ICON_ARCHIVE}</button>
      </div>
    </div>
  `;
  return card;
}

function passes(p) {
  if (filters.status !== 'all' && p.status !== filters.status) return false;
  if (filters.team !== 'all' && p.team !== filters.team) return false;
  if (filters.q) {
    const q = filters.q.toLowerCase();
    if (!p.name.toLowerCase().includes(q) && !p.application.toLowerCase().includes(q) && !p.desc.toLowerCase().includes(q)) return false;
  }
  return true;
}

function renderAll() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const filtered = pipelines.filter(passes);
  filtered.forEach((p, i) => grid.appendChild(renderCard(p, i)));
}

document.querySelectorAll('#statusFilter .opt-pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#statusFilter .opt-pill').forEach(x => {
      x.classList.remove('active', 'primary', 'published', 'draft', 'archived');
    });
    p.classList.add('active');
    const s = p.dataset.status;
    if (s === 'all') p.classList.add('primary');
    else p.classList.add(s.toLowerCase());
    filters.status = s;
    renderAll();
  });
});

document.querySelectorAll('#teamFilter .opt-pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('#teamFilter .opt-pill').forEach(x => {
      x.classList.remove('active', 'primary');
    });
    p.classList.add('active', 'primary');
    filters.team = p.dataset.team;
    renderAll();
  });
});

document.getElementById('searchInput').addEventListener('input', e => {
  filters.q = e.target.value.trim();
  renderAll();
});

renderAll();
</script>
